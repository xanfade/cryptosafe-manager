[pytest]
testpaths = tests
python_files = test_*.py
addopts =
    --cov=src.core.crypto
    --cov=src.core.import_export
    --cov=src.core.vault
    --cov=src.core.clipboard
    --cov=src.core.services.vault_service
    --cov=src.database
    --cov-report=term-missing
    --cov-report=html:tests/report/htmlcov
    --cov-report=xml:tests/report/coverage.xml
    --junitxml=tests/report/junit.xml
    --cov-fail-under=80
